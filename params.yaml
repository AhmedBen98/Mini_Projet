# Configuration centralisée des hyperparamètres - Diabetes Dataset

# Dataset Configuration
dataset:
  name: "diabetes"
  test_size: 0.2
  val_size: 0.1
  random_state: 42

# Preprocessing
preprocessing:
  scaler: "standard"  # Options: standard, minmax, robust
  handle_missing: "mean"  # Options: mean, median, drop
  outlier_threshold: 3  # Standard deviations

# Feature Engineering
feature_engineering:
  polynomial_features: false
  degree: 2
  interaction_only: false
  feature_selection: true
  n_features_to_select: 10

# Model Configuration - Diabetes (GradientBoosting)
model_diabetes:
  type: "GradientBoostingRegressor"
  n_estimators: 150
  learning_rate: 0.1
  max_depth: 5
  min_samples_split: 4
  min_samples_leaf: 3
  subsample: 0.8
  random_state: 42

# Optuna Optimization
optuna:
  n_trials: 50
  timeout: 3600  # 1 hour
  n_jobs: 1
  sampler: "TPE"  # TPE, Random, Grid
  pruner: "MedianPruner"
  direction: "maximize"

# MLflow
mlflow:
  tracking_uri: "./mlruns"
  experiment_name: "diabetes-progression-experiment"
  run_name: "default-run"
  log_models: true
  log_artifacts: true

# Evaluation
evaluation:
  cv_folds: 5
  scoring: "r2"  # For regression: r2, neg_mean_squared_error, neg_mean_absolute_error
  generate_plots: true
  save_predictions: true
